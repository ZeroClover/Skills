# =============================================================================
# clean-agent-cache target registry
# =============================================================================
# Structured, maintainable inventory of safe-to-delete data for AI coding
# agents. The cleanup engine (../scripts/clean.py) reads ONLY this file; to add
# or adjust what gets cleaned, edit this registry — never hard-code paths in the
# script.
#
# Verified first-class agents (this machine, macOS): claude-code, codex.
# Other agents come from research; paths absent on this machine are skipped.
#
# -----------------------------------------------------------------------------
# Schema
# -----------------------------------------------------------------------------
# version            integer   registry schema version.
#
# protected = [...]  array     Globs that must NEVER be deleted. The engine
#                              refuses to delete any path that equals, contains,
#                              or is contained by a protected path (so deleting a
#                              parent that holds a protected child is blocked too).
#                              This is defense-in-depth; targets below already
#                              avoid these.
#
# [[agent]]                    One per agent. Fields:
#   key            string      stable id used by targets and --agent filter.
#   label          string      human name.
#   process_match  [string]    case-insensitive substrings; if any running
#                              process command matches, the agent counts as
#                              "running" and targets with requires_app_closed
#                              are skipped.
#
# [[target]]                   One per cleanable item. Fields:
#   agent                string   must match an [[agent]].key
#   id                   string   unique within the agent
#   surface              string   cli | desktop | shared  (informational)
#   category             string   cache | gpu-cache | logs | telemetry | temp |
#                                 snapshots | sessions | history |
#                                 archived-sessions | backups | versions
#   risk                 string   safe | history | aggressive
#                                 safe       = caches/logs/temp; cleaned by default
#                                 history    = conversation/session/command history;
#                                              opt-in via --include history
#                                 aggressive = large re-downloadable/rebuildable
#                                              data; opt-in via --include aggressive
#   op                   string   delete-contents | delete-glob | delete-path |
#                                 keep-recent | sqlite-prune
#                                 delete-contents = empty the dir, keep the dir
#                                 delete-glob     = delete files/dirs matching glob
#                                 delete-path     = delete the path(s) entirely
#                                 keep-recent     = keep newest `keep`, delete rest
#                                 sqlite-prune    = DELETE rows from `table` (older
#                                                   than --older-than when given) +
#                                                   VACUUM to reclaim disk in place
#   keep                 integer  required for keep-recent
#   table                string   required for sqlite-prune: table to prune
#   ts_column            string   optional for sqlite-prune: timestamp column used
#                                 by --older-than (auto-detects s/ms/us/ns scale)
#   os                   [string] subset of darwin|linux|windows; omit = all
#   paths                [string] globs ("~" expanded; "**" enables recursion)
#   requires_app_closed  bool     skip while the agent is running (default false)
#   description          string   what this is
#   note                 string   optional caveat
# =============================================================================

version = 1

protected = [
  # --- Claude Code (CLI) ---
  "~/.claude/settings.json",
  "~/.claude/keybindings.json",
  "~/.claude/.credentials.json",
  "~/.claude.json",
  "~/.claude/plugins",
  "~/.claude/skills",
  "~/.claude/projects/*/memory",   # persistent auto-memory — never delete
  "~/.claude/sessions",            # active session registry
  "~/.claude/tasks",
  "~/.claude/teams",
  "~/.claude/ide",
  # --- Claude desktop (login/profile state) ---
  "~/Library/Application Support/Claude/Cookies",
  "~/Library/Application Support/Claude/Local Storage",
  "~/Library/Application Support/Claude/Session Storage",
  "~/Library/Application Support/Claude/IndexedDB",
  "~/Library/Application Support/Claude/WebStorage",
  "~/Library/Application Support/Claude/Trust Tokens",
  "~/Library/Application Support/Claude/DIPS",
  "~/Library/Application Support/Claude/ca-bundle.pem",
  # --- Codex (CLI) ---
  "~/.codex/auth.json",
  "~/.codex/config.toml",
  "~/.codex/AGENTS.md",
  "~/.codex/installation_id",
  "~/.codex/.codex-global-state.json",
  "~/.codex/memories",
  "~/.codex/memories_1.sqlite*",
  "~/.codex/state_5.sqlite*",
  "~/.codex/goals_1.sqlite*",      # holds active /goal — its hook depends on it
  "~/.codex/prompts",
  "~/.codex/skills",
  "~/.codex/plugins",
  "~/.codex/.tmp/plugins",
  "~/.codex/vendor_imports",
  "~/.codex/computer-use",          # bundled Computer Use.app binary
  "~/.codex/attachments",
  "~/.codex/sqlite",
  "~/.codex/process_manager",
  "~/.codex/tmp",                   # live runtime workdirs
  "~/.codex/node_repl",
  # --- Codex desktop (login/profile state) ---
  "~/Library/Application Support/Codex/Default/Cookies",
  "~/Library/Application Support/Codex/Default/Login Data",
  "~/Library/Application Support/Codex/Default/History",
  "~/Library/Application Support/Codex/Default/Web Data",
  "~/Library/Application Support/Codex/Default/Local Storage",
  "~/Library/Application Support/Codex/Default/Network",
  # --- Cursor ---
  "~/Library/Application Support/Cursor/User/settings.json",
  "~/Library/Application Support/Cursor/User/keybindings.json",
  "~/Library/Application Support/Cursor/User/snippets",
  "~/Library/Application Support/Cursor/User/globalStorage/state.vscdb",
  "~/Library/Application Support/Cursor/Cookies",
  "~/Library/Application Support/Cursor/Local Storage",
  "~/.cursor/extensions",
  "~/.cursor/mcp.json",
  "~/.cursor/cli-config.json",
  # --- OpenCode ---
  "~/.local/share/opencode/auth.json",
  "~/.config/opencode",
  # --- ZCode ---
  "~/.zcode/v2/credentials.json",
  "~/.zcode/v2/config.json",
  "~/.zcode/v2/setting.json",
  "~/.zcode/v2/certs",
  "~/.zcode/skills",
  # --- Antigravity (conversations/brain are history, NOT cache) ---
  "~/.gemini/antigravity/conversations",
  "~/.gemini/antigravity/brain",
  "~/.gemini/antigravity/annotations",
  "~/.gemini/antigravity-cli/conversations",
  "~/.gemini/antigravity-cli/brain",
  "~/.gemini/config",
  "~/.antigravity/extensions",
  # --- Conductor (worktrees may hold uncommitted code) ---
  "~/conductor/workspaces",
  "~/Library/Application Support/com.conductor.app/bin",
  # --- Kimi Code ---
  "~/.kimi-code/config.toml",
  "~/.kimi-code/tui.toml",
  "~/.kimi-code/credentials",
  "~/.kimi-code/mcp.json",
  "~/.kimi-code/skills",
  # --- Grok (~/.grok shared by two tools; protect creds/config) ---
  "~/.grok/user-settings.json",
  "~/.grok/auth.json",
  "~/.grok/config.toml",
  "~/.grok/schedules",
  # --- Pi ---
  "~/.pi/agent/auth.json",
  "~/.pi/agent/settings.json",
  "~/.pi/agent/models.json",
  "~/.pi/agent/trust.json",
  "~/.pi/agent/extensions",
  "~/.pi/agent/agents",
  "~/.pi/agent/skills",
  "~/.pi/agent/prompts",
  "~/.pi/agent/themes",
]

# =============================================================================
# Agents
# =============================================================================
[[agent]]
key = "claude-code"
label = "Claude Code"
process_match = ["Claude.app"]

[[agent]]
key = "codex"
label = "Codex"
process_match = ["Codex.app", "Resources/codex"]

[[agent]]
key = "cursor"
label = "Cursor"
process_match = ["Cursor.app", "Cursor Helper"]

[[agent]]
key = "opencode"
label = "OpenCode"
process_match = ["opencode"]

[[agent]]
key = "zcode"
label = "ZCode (Zhipu)"
process_match = ["ZCode.app", "ZCode Helper"]

[[agent]]
key = "antigravity"
label = "Antigravity"
process_match = ["Antigravity.app", "Antigravity Helper"]

[[agent]]
key = "conductor"
label = "Conductor"
process_match = ["Conductor.app", "com.conductor"]

[[agent]]
key = "kimi-code"
label = "Kimi Code"
process_match = ["kimi-code", "/.kimi-code/"]

[[agent]]
key = "grok"
label = "Grok Build"
process_match = ["/.grok/"]

[[agent]]
key = "pi"
label = "Pi"
process_match = ["pi-coding-agent"]

# =============================================================================
# Claude Code — CLI (~/.claude)
# =============================================================================
[[target]]
agent = "claude-code"
id = "cli-cache"
surface = "cli"
category = "cache"
risk = "safe"
op = "delete-contents"
paths = ["~/.claude/cache"]
description = "Changelog and closed-issues cache (changelog.md, my-closed-issues.json)."

[[target]]
agent = "claude-code"
id = "cli-paste-cache"
surface = "cli"
category = "cache"
risk = "safe"
op = "delete-contents"
paths = ["~/.claude/paste-cache"]
description = "Cached pasted content."

[[target]]
agent = "claude-code"
id = "cli-mcp-auth-cache"
surface = "cli"
category = "cache"
risk = "safe"
op = "delete-path"
paths = ["~/.claude/mcp-needs-auth-cache.json"]
description = "Cache of which MCP servers need re-auth; rebuilt on demand."

[[target]]
agent = "claude-code"
id = "cli-telemetry"
surface = "cli"
category = "telemetry"
risk = "safe"
op = "delete-glob"
paths = ["~/.claude/telemetry/*.json"]
description = "Queued/failed local telemetry events (1p_failed_events.*)."

[[target]]
agent = "claude-code"
id = "cli-shell-snapshots"
surface = "cli"
category = "snapshots"
risk = "safe"
op = "delete-glob"
paths = ["~/.claude/shell-snapshots/*"]
description = "Captured shell-env snapshots; regenerated on next session."
note = "An active session already sourced its snapshot, so removal is safe."

[[target]]
agent = "claude-code"
id = "cli-session-env"
surface = "cli"
category = "temp"
risk = "safe"
op = "delete-glob"
paths = ["~/.claude/session-env/*"]
description = "Per-session environment snapshots (accumulate as empty/stale dirs)."

[[target]]
agent = "claude-code"
id = "cli-nodejs-cache"
surface = "shared"
category = "cache"
risk = "safe"
op = "delete-contents"
os = ["darwin"]
paths = ["~/Library/Caches/claude-cli-nodejs"]
description = "Node CLI HTTP/asset cache."

[[target]]
agent = "claude-code"
id = "cli-config-backups"
surface = "cli"
category = "backups"
risk = "safe"
op = "keep-recent"
keep = 3
paths = ["~/.claude/backups/.claude.json.backup.*"]
description = "Rolling ~/.claude.json backups; keep the 3 newest."

[[target]]
agent = "claude-code"
id = "cli-history"
surface = "cli"
category = "history"
risk = "history"
op = "delete-path"
paths = ["~/.claude/history.jsonl"]
description = "Global prompt/command history."
note = "Quit running Claude Code CLIs first."

[[target]]
agent = "claude-code"
id = "cli-project-transcripts"
surface = "cli"
category = "sessions"
risk = "history"
op = "delete-glob"
paths = ["~/.claude/projects/**/*.jsonl"]
description = "Per-project conversation transcripts (largest CLI footprint)."
note = "Only *.jsonl; the projects/*/memory dirs are protected. Use --older-than to keep recent."

[[target]]
agent = "claude-code"
id = "cli-file-history"
surface = "cli"
category = "history"
risk = "history"
op = "delete-glob"
paths = ["~/.claude/file-history/*"]
description = "Per-session file-edit history used for in-session restore."

