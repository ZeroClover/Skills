# =============================================================================
# Codex — CLI (~/.codex)
# =============================================================================
[[target]]
agent = "codex"
id = "cli-cache"
surface = "cli"
category = "cache"
risk = "safe"
op = "delete-contents"
paths = ["~/.codex/cache"]
description = "App directory / plugin catalog / app-tools caches."

[[target]]
agent = "codex"
id = "cli-shell-snapshots"
surface = "cli"
category = "snapshots"
risk = "safe"
op = "delete-glob"
paths = ["~/.codex/shell_snapshots/*"]
description = "Captured shell-env snapshots; regenerated on next session."

[[target]]
agent = "codex"
id = "cli-ambient-suggestions"
surface = "cli"
category = "cache"
risk = "safe"
op = "delete-glob"
paths = ["~/.codex/ambient-suggestions/*"]
description = "Cached ambient suggestions."

[[target]]
agent = "codex"
id = "cli-log-dir"
surface = "cli"
category = "logs"
risk = "safe"
op = "delete-glob"
paths = ["~/.codex/log/*"]
description = "Plain-text log directory."

[[target]]
agent = "codex"
id = "cli-global-state-bak"
surface = "cli"
category = "backups"
risk = "safe"
op = "delete-path"
paths = ["~/.codex/.codex-global-state.json.bak"]
description = "Backup copy of global state."

[[target]]
agent = "codex"
id = "cli-logs-db"
surface = "cli"
category = "logs"
risk = "safe"
op = "sqlite-prune"
table = "logs"
ts_column = "ts"
paths = ["~/.codex/logs*.sqlite"]
requires_app_closed = true
description = "Structured log database (a single 'logs' table, often GBs of TRACE/DEBUG rows)."
note = "Pruned in place via DELETE + VACUUM to reclaim disk; --older-than keeps recent rows. Quit Codex first (VACUUM needs exclusive access)."

[[target]]
agent = "codex"
id = "cli-tmp-marketplaces"
surface = "cli"
category = "cache"
risk = "aggressive"
op = "delete-path"
paths = ["~/.codex/.tmp/bundled-marketplaces"]
requires_app_closed = true
description = "Bundled plugin-marketplace staging cache (large)."
note = "Re-downloaded on next plugin sync. .tmp/plugins is protected."

[[target]]
agent = "codex"
id = "cli-history"
surface = "cli"
category = "history"
risk = "history"
op = "delete-path"
paths = [
  "~/.codex/history.jsonl",
  "~/.codex/session_index.jsonl",
]
description = "Command history and the session index."
note = "Quit running Codex first. Index is rebuilt from remaining sessions."

[[target]]
agent = "codex"
id = "cli-sessions"
surface = "cli"
category = "sessions"
risk = "history"
op = "delete-glob"
paths = ["~/.codex/sessions/**/*.jsonl"]
description = "Rollout session transcripts (date-bucketed)."
note = "Use --older-than to keep recent sessions."

[[target]]
agent = "codex"
id = "cli-archived-sessions"
surface = "cli"
category = "archived-sessions"
risk = "history"
op = "delete-glob"
paths = ["~/.codex/archived_sessions/*"]
description = "Sessions you previously archived."

